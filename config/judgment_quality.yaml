# 저지능 모델 호환 강화 구조 - 2단계(2026-09-01, 사용자 지시).
# 이 값들만 바꾸면 아래 동작이 바뀐다 - 코드는 값을 읽기만 한다.

# review_titles 판정 배치를 이 크기 이하의 청크로 쪼갠다. 기본값(200)은
# QA 기본 round-size(50)+카나리아보다 커서 평소엔 청크가 1개(=기존 동작과
# 동일)다. 지능이 더 낮은 모델을 세션에 붙였다면 이 값을 낮춰서(예: 10~20)
# 한 번에 봐야 하는 항목 수를 줄여줄 것.
review_titles_chunk_size: 200

# 판정 응답의 구조적 결함(제목 불일치/타입 오류/checks 필드 논리 모순 등)
# 비율이 이 값을 넘으면 "판단이 아니라 형식 자체를 못 지켰다"고 보고 같은
# 청크를 더 엄격한 지침으로 재요청한다. 이 값 이하의 결함은 해당 항목만
# 자동 거절 처리(안전 기본값)하고 계속 진행한다.
structural_invalid_ratio_for_full_retry: 0.3

# 구조 재요청 최대 횟수(청크당). 초과하면 남은 결함 항목은 자동 거절로
# 확정하고 무한 재시도하지 않는다.
structural_retry_max: 1

# expand_word_bank 제안 중 형식 검증(_consume_word_bank_expansion)을
# 통과한 비율이 이 값 미만이면 "지침을 못 따라간 것"으로 보고 1회 재요청한다.
expand_word_bank_min_valid_ratio: 0.5

# 유효 제안 중 "이미 시도된 패턴 태그가 아닌" 비율이 이 값 미만이면(탐색
# 부족) 1회 재요청한다. 재요청 후에도 미달이면 그대로 받아들이고 계속
# 진행한다(무한 루프 방지).
exploration_quota_pct: 0.3

expand_word_bank_retry_max: 1

# 이 라운드 수마다 한 번, 지금까지 validated로 승격된 핵심 원칙을
# 전담 반박 역할로 재검증하는 `principle_reverification` 판정을 강제로 연다.
# 0 이하면 비활성화.
principle_reverification_every_n_rounds: 10
